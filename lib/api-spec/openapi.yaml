openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: decision
    description: Leadership simulation decision processing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /start:
    post:
      operationId: startSimulation
      tags: [decision]
      summary: Start a role-based simulation
      description: Generates the first role-specific scenario based on the chosen role and seniority level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          description: AI-generated opening scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResult"
        "500":
          description: AI processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /decision:
    post:
      operationId: processDecision
      tags: [decision]
      summary: Process a leadership decision
      description: Sends current game state and player choice to AI for dynamic scenario generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: AI-generated scenario result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "500":
          description: AI processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evaluate:
    post:
      operationId: evaluateSimulation
      tags: [decision]
      summary: Generate a leadership evaluation report
      description: Sends the full decision history to AI for a final leadership assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
      responses:
        "200":
          description: AI-generated evaluation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResult"
        "500":
          description: AI processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DecisionRequest:
      type: object
      properties:
        choice:
          type: string
          enum: [A, B]
        choiceText:
          type: string
        scenarioText:
          type: string
        stats:
          type: object
          properties:
            perimeter:
              type: number
            morale:
              type: number
            resources:
              type: number
          required:
            - perimeter
            - morale
            - resources
        decisionCount:
          type: number
        roleName:
          type: string
        roleEn:
          type: string
        roleLevel:
          type: string
      required:
        - choice
        - choiceText
        - scenarioText
        - stats
        - decisionCount
        - roleName
        - roleEn
        - roleLevel
    DecisionResult:
      type: object
      properties:
        statDeltas:
          type: object
          properties:
            perimeter:
              type: number
            morale:
              type: number
            resources:
              type: number
          required:
            - perimeter
            - morale
            - resources
        nextScenario:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        analysis:
          type: string
      required:
        - statDeltas
        - nextScenario
        - optionA
        - optionB
        - analysis
    HistoryEntry:
      type: object
      properties:
        round:
          type: number
        scenarioText:
          type: string
        choice:
          type: string
        choiceText:
          type: string
        deltas:
          type: object
          properties:
            perimeter:
              type: number
            morale:
              type: number
            resources:
              type: number
          required: [perimeter, morale, resources]
      required: [round, scenarioText, choice, choiceText, deltas]
    EvaluateRequest:
      type: object
      properties:
        stats:
          type: object
          properties:
            perimeter:
              type: number
            morale:
              type: number
            resources:
              type: number
          required: [perimeter, morale, resources]
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        rounds:
          type: number
        endReason:
          type: string
          enum: [max_rounds, stat_zero]
        roleName:
          type: string
        roleEn:
          type: string
        roleLevel:
          type: string
      required: [stats, history, rounds, endReason, roleName, roleEn, roleLevel]
    StartRequest:
      type: object
      properties:
        roleName:
          type: string
        roleEn:
          type: string
        roleLevel:
          type: string
      required: [roleName, roleEn, roleLevel]
    StartResult:
      type: object
      properties:
        scenario:
          type: string
        optionA:
          type: string
        optionB:
          type: string
      required: [scenario, optionA, optionB]
    EvaluateResult:
      type: object
      properties:
        archetype:
          type: string
        archetypeEn:
          type: string
        overallScore:
          type: number
        verdict:
          type: string
        deepAnalysis:
          type: string
        strengths:
          type: array
          items:
            type: string
        blindspots:
          type: array
          items:
            type: string
      required: [archetype, archetypeEn, overallScore, verdict, deepAnalysis, strengths, blindspots]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
